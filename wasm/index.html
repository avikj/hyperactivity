<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hyperactivity WebAssembly gates</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#000);--ink:light-dark(#000,#fff);--dim:light-dark(#555,#aaa);--pink:#ff0a94;--rule:light-dark(#000,#fff)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px);max-width:1240px;margin:0 auto}
header{background:var(--pink);color:#fff}
h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:0}
h2{font-size:20px;margin:28px 0 8px}
p{max-width:72ch}
a{color:var(--pink)}
.mod{border:2px solid var(--rule);margin:0 0 20px;padding:16px}
.fn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--rule);padding:8px 0}
.fn b{min-width:16ch}
input{font:16px ui-monospace,monospace;width:9ch;padding:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{font:inherit;background:var(--ink);color:var(--bg);border:0;padding:8px 14px;min-height:44px;cursor:pointer;border-radius:0}
.out{color:var(--pink);font-weight:700;overflow-wrap:anywhere}
.tt{color:var(--dim);font-size:14px}
</style>
</head>
<body>
<header><div class="band"><h1>WebAssembly gate libraries</h1><p>Zero-import WebAssembly 1.0 modules lowered by the hyperactivity kernel from checked NAND2 witnesses and polynomial normal forms. Every function runs in this page; load the same files with <code>WebAssembly.instantiate</code> in any browser or Node.</p></div></header>
<main class="band" id="mods"><p>Loading modules…</p></main>
<script>
{
const MODS={
 'inet_opt.wasm':{about:'Interaction-net processor cells, each a minimal NAND2 netlist. 1-bit inputs (0 or 1); the 3-input truth table shown is computed live and matches the proved table.',bits:1,want:{face_conflict:224,demorgan_mux:142,commute:96,era_prune:254,gals_clk_en:242,vxchg_fire:8,aux_mux2:202,maj3_carry:232,xor2_vxchg:102}},
 'poly.wasm':{about:'Polynomial and bitwise kernels on 32-bit words (Karatsuba middle term, Gaussian integer product, Horner cubic, Cayley SU(2), SHA-256 Ch and Maj, full-adder carry).'},
 'meta_meta.wasm':{about:'4-input cubical and interaction-net datapath cells.'},
 'omni_omni.wasm':{about:'4-input cells shared with the omni engine.'},
 'genesis.wasm':{about:'Howell–Lafon rank-8 quaternion product terms, adelic butterfly, reversible Fredkin gate.'},
 'psc.wasm':{about:'BF16 unpack and multiply to FP32; fiber XOR and AND.'},
 'verify.wasm':{about:'Verified macro-steps: eigen, Horner, 4-way mux.'}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=document.getElementById('mods');
(async()=>{
 const parts=[];const inst={};
 for(const f of Object.keys(MODS)){
  try{const {instance}=await WebAssembly.instantiateStreaming?await WebAssembly.instantiateStreaming(fetch(f),{}).catch(async()=>WebAssembly.instantiate(await (await fetch(f)).arrayBuffer(),{})):await WebAssembly.instantiate(await (await fetch(f)).arrayBuffer(),{});inst[f]=instance.exports;}
  catch(e){parts.push(`<section class="mod"><h2>${esc(f)}</h2><p>Could not load: ${esc(e.message)}</p></section>`);continue}
  const fns=Object.entries(inst[f]).filter(([,v])=>typeof v==='function');
  const rows=fns.map(([n,fn])=>{
   let tt='';const w=MODS[f].want&&MODS[f].want[n];
   if(MODS[f].bits===1&&fn.length===3){let t=0;for(let m=0;m<8;m++)t|=(fn(m&1,(m>>1)&1,(m>>2)&1)&1)<<m;tt=`truth table ${t}${w!==undefined?(t===w?' = proved '+w:' ≠ proved '+w):''}`}
   const ins=Array.from({length:fn.length},(_,i)=>`<input inputmode="numeric" aria-label="${esc(n)} argument ${i}" data-f="${esc(f)}" data-n="${esc(n)}" value="${MODS[f].bits===1?(i%2):0}">`).join('');
   return `<div class="fn"><b>${esc(n)}</b>${ins}<button data-f="${esc(f)}" data-n="${esc(n)}">Run</button><span class="out" id="o-${esc(f)}-${esc(n)}"></span><span class="tt">${esc(tt)}</span></div>`}).join('');
  parts.push(`<section class="mod"><h2><a href="./${encodeURIComponent(f)}">${esc(f)}</a></h2><p>${esc(MODS[f].about)}</p>${rows}</section>`);
 }
 main.innerHTML=parts.join('')+'<p><a href="./SHA256SUMS">SHA256SUMS</a> · <a href="../">all releases</a></p>';
 main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const f=b.dataset.f,n=b.dataset.n;
  const args=[...main.querySelectorAll(`input[data-f="${CSS.escape(f)}"][data-n="${CSS.escape(n)}"]`)].map(i=>Number(i.value)|0);
  let r;try{r=inst[f][n](...args)}catch(x){r='error: '+x.message}
  document.getElementById(`o-${f}-${n}`).textContent=typeof r==='number'?`${r>>>0} (0x${(r>>>0).toString(16)})`:String(r)});
})();
}
</script>
</body>
</html>
