# One source and the ban on code in other languages (Avik, 2026-11-15): every push and pull request is
# judged by lib/guard.hypercubical, the hyperactive program the pre-commit hook runs, on the commit checked out.
name: one source
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -s build/cubical && build/cubical lib/guard.hypercubical
  # Nothing breaks on main (Avik, 2026-11-23: "nothing should break on main"): every push and pull
  # request also checks the whole library and computes Brunerie's number on 1 and 4 workers.
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -s build/cubical && make library brunerie
