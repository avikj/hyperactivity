# One source (Avik, 2026-11-15: "ONE SOURCE OF INFORMATION"; "by construction we must ensure no pushes
# violate this"): every push and pull request is judged by tools/task-graph.py one-source; a pull
# request that stores information twice cannot be merged once this check is required on main.
name: one source
on: [push, pull_request]
jobs:
  one-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/task-graph.py one-source HEAD
