<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperactive · history</title>
<style>
:root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1a17; --muted: #6f6b62; --faint: #b7b2a7; --line: #e3dfd5;
  --org: #2c5f8a; --org-bg: #e8f0f7; --node: #1d7a45; --node-bg: #e7f4ec; --side: #a86400; --side-bg: #fbf1e1; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121211; --panel: #1b1b19; --ink: #eceae4; --muted: #a39f95; --faint: #5f5c55; --line: #2c2b28;
    --org: #7fb4e6; --org-bg: #142233; --node: #5fd18d; --node-bg: #12291c; --side: #f0b45a; --side-bg: #2e2312; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
header { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 22px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); z-index: 5; }
header h1 { font-size: 15px; font-weight: 650; margin: 0; }
header a { color: var(--muted); text-decoration: none; font-size: 13px; }
header a:hover { color: var(--ink); }
header input { flex: 1; max-width: 460px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: inherit; }
#days { position: fixed; top: 56px; bottom: 0; left: 0; width: 250px; overflow: auto; border-right: 1px solid var(--line); padding: 10px 0; }
.day { padding: 7px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.day:hover, .day.on { background: var(--panel); }
.day .d { font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--faint); }
.day .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
#main { position: fixed; top: 56px; bottom: 0; left: 250px; right: 0; overflow: auto; padding: 18px 26px 60px; }
.change { padding: 9px 12px; border-radius: 10px; cursor: pointer; display: grid; grid-template-columns: 52px 66px 1fr; gap: 0 12px; }
.change:hover { background: var(--panel); }
.change .t, .change .g { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.change .g { font-family: ui-monospace, monospace; }
.change .s { min-width: 0; }
.change .who { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
.ev { display: block; margin-top: 4px; font-size: 12.5px; padding: 2px 8px; border-radius: 6px; width: fit-content; max-width: 100%;
  background: var(--org-bg); color: var(--org); overflow-wrap: anywhere; }
.ev.node { background: var(--node-bg); color: var(--node); }
.lane { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--side-bg); color: var(--side); margin-left: 6px; }
.quiet .s { color: var(--muted); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, monospace; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 0; }
pre a { color: var(--org); cursor: pointer; }
h2 { font-size: 15px; margin: 4px 0 12px; }
.toggle { color: var(--muted); font-size: 12.5px; cursor: pointer; margin: 0 0 10px; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>History of the work</h1>
  <input id="q" placeholder="Every version of a file or a declaration (Enter)">
  <a href="#" id="words">Avik's words</a>
  <a href="/">Task graph</a>
</header>
<div id="main" style="left:0"></div>
<script>
// The page shows what `hyperactive history` shows (tools/history.py): git ids open their change, days open the day.
const $ = s => document.querySelector(s), esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
async function show(q, title) {
  $('#main').innerHTML = `<h2>${esc(title)}</h2><pre>loading…</pre>`;
  const r = await (await fetch('/api/history' + (q ? '?' + new URLSearchParams(q) : ''))).json();
  $('#main').innerHTML = `<h2>${esc(title)}</h2><pre>${esc(r.text)
    .replace(/^(\d{4}-\d{2}-\d{2})(?=  )/gm, '<a data-day="$1">$1</a>')
    .replace(/\b([0-9a-f]{7})\b/g, '<a data-change="$1">$1</a>')}</pre>`;
  $('#main').scrollTop = 0;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-change],[data-day]');
  if (a && a.dataset.change) show({change: a.dataset.change}, 'Change ' + a.dataset.change);
  else if (a) show({day: a.dataset.day}, a.dataset.day + ' (UTC)');
});
$('#q').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) show({of: e.target.value.trim()}, e.target.value.trim()); };
$('#words').onclick = e => { e.preventDefault(); show({words: 1}, "Avik's words, as they entered the work"); };
$('h1').onclick = () => show(null, 'History of the work, a day at a time (UTC)');
show(null, 'History of the work, a day at a time (UTC)');
</script>
</body>
</html>
